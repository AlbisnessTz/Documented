name: Build Documented

on:
  push:
    branches: [ main, feature/documented-mvp ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Documented.sln
      - name: Build
        run: dotnet build Documented.sln --configuration Release --no-restore
